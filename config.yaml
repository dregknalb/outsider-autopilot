timezone: Europe/Berlin
graph_api_version: v26.0        # aktuelle Graph-API-Version; bei Fehler "unsupported version" v25.0 testen
model: claude-sonnet-5-5        # Modell für Texterstellung
calendar: content_calendar.csv
brand_profile: brand_profile.md
# Öffentliche Basis-URL, unter der der Ordner media/ erreichbar ist.
# GitHub (öffentliches Repo): https://raw.githubusercontent.com/<user>/<repo>/main
media_base_url: "https://raw.githubusercontent.com/dregknalb/outsider-autopilot/main"
design:
  width: 1080
  height: 1350
  background: "#1D1E21"
  title_size: 100
  cover_title_size: 132
  body_size: 46
  text: "#F2F2F0"
  accent: "#8A8A86"
  handle: "@outsidermagazin.de"
  font_title: "fonts/title.ttf"
  font_body: "fonts/body.ttf"
  wordmark: "brand/wordmark_white.png"   # Schriftzug in der Kopfzeile (leer lassen = nur Handle)
  tagline: "Finest Products for mobile People"
  background_art: topo     # Höhenlinien, wenn kein Foto vorhanden (leer = einfarbig)
  photo_overlay: 0.55      # Abdunklung von Fotos (0-1) für Lesbarkeit
ideas_per_run: 8
buffer_posts: 12
draft_days_ahead: 14
render_days_ahead: 14
notify_days_ahead: 7
max_posts_per_day: 2
