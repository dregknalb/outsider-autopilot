name: freigabe
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  approve:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Freigabe p')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      COMMENT: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Freigabe verarbeiten
        run: |
          git config user.name "autopilot"; git config user.email "autopilot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python src/approve.py
            git add -A
            git commit -m "Freigabe verarbeitet" || break
            git push && break
            sleep 5
          done
